name: Deploy

# Deploys to Cloudflare Workers on every push to main, and on demand.
# Requires the CLOUDFLARE_API_TOKEN repo secret — see docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Quality gate + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run gate

      - name: Build (Vite + Cloudflare plugin)
        run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply bottega --remote

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
